[package]
name = "cat-pacer"
version = "0.1.0"
edition = "2024"
description = "Lightweight CAT frequency pacer for radio amplifiers"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
